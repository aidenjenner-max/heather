/* ---------- Accounts: sign in with Facebook (Supabase Auth); the garden is saved to the account ----------
   Facebook sends people back with tokens in the address (#access_token=…). We keep the session in
   localStorage ("heather-auth"), save the whole garden (S) to public.profiles (each person can only
   read and write their own row) and pull it back on any device they sign in on. */
var AUTH = null, cloudTimer = null, cloudBusy = false;
const AUTH_KEY = "heather-auth";
try { AUTH = JSON.parse(localStorage.getItem(AUTH_KEY) || "null"); } catch (e) { AUTH = null; }
function authSave() { try { AUTH ? localStorage.setItem(AUTH_KEY, JSON.stringify(AUTH)) : localStorage.removeItem(AUTH_KEY); } catch (e) { /* ignore */ } }
function signedIn() { return !!(AUTH && AUTH.access_token); }
function firstName(full) { return String(full || "").trim().split(/\s+/)[0].slice(0, 40); }

async function facebookReady() {
  try {
    const r = await fetch(`${SUPA_URL}/auth/v1/settings`, { headers: { apikey: SUPA_KEY } });
    const d = await r.json();
    return !!(d.external && d.external.facebook);
  } catch (e) { return null; }   // null = couldn't check (offline)
}
async function signInWithFacebook(btn) {
  if (btn) { btn.disabled = true; btn.dataset.label = btn.innerHTML; btn.textContent = "Opening Facebook…"; }
  const ok = await facebookReady();
  if (ok !== true) {
    if (btn) { btn.disabled = false; btn.innerHTML = btn.dataset.label; }
    toast(ok === false ? "Facebook sign-in is almost ready. You can play now and save your garden to Facebook later in Settings." : "Couldn't reach Facebook. Check the internet connection and try again.");
    return false;
  }
  S.signupPending = true; save();
  location.href = `${SUPA_URL}/auth/v1/authorize?provider=facebook&scopes=${encodeURIComponent("email public_profile")}&redirect_to=${encodeURIComponent(appLink())}`;
  return true;
}
/* Called once at start-up, before the first screen draws */
function authFromUrl() {
  const h = new URLSearchParams(location.hash.replace(/^#/, "")), q = new URLSearchParams(location.search);
  const clear = () => { try { const u = new URL(location.href); ["error", "error_code", "error_description"].forEach(k => u.searchParams.delete(k)); history.replaceState(null, "", u.pathname + u.search); } catch (e) { /* ignore */ } };
  if (h.get("access_token")) {
    AUTH = { access_token: h.get("access_token"), refresh_token: h.get("refresh_token"), expires_at: Math.floor(Date.now() / 1000) + Number(h.get("expires_in") || 3600) };
    authSave(); clear(); return "signed_in";
  }
  const err = h.get("error_description") || q.get("error_description") || h.get("error") || q.get("error");
  if (err) { clear(); S.signupPending = false; save(); return "error"; }
  return null;
}
async function authToken() {
  if (!signedIn()) return null;
  if ((AUTH.expires_at || 0) - 60 > Date.now() / 1000) return AUTH.access_token;
  const r = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=refresh_token`, { method: "POST", headers: { apikey: SUPA_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ refresh_token: AUTH.refresh_token }) });
  if (r.status === 400 || r.status === 401 || r.status === 403) { AUTH = null; authSave(); return null; }
  if (!r.ok) throw new Error("offline");
  const d = await r.json();
  AUTH = Object.assign(AUTH, { access_token: d.access_token, refresh_token: d.refresh_token, expires_at: d.expires_at || Math.floor(Date.now() / 1000) + (d.expires_in || 3600) });
  authSave(); return AUTH.access_token;
}
async function authFetch(path, opts = {}) {
  const tok = await authToken();
  if (!tok) { const e = new Error("signed_out"); e.code = "signed_out"; throw e; }
  return fetch(SUPA_URL + path, Object.assign({}, opts, { headers: Object.assign({ apikey: SUPA_KEY, Authorization: "Bearer " + tok, "Content-Type": "application/json" }, opts.headers || {}) }));
}
function normalizeState(o) {
  const s = Object.assign(freshState(), o || {});
  s.settings = Object.assign(freshState().settings, s.settings || {});
  s.garden = Object.assign(freshState().garden, s.garden || {});
  s.word = Object.assign(freshState().word, s.word || {});
  s.loop = Object.assign(freshState().loop, s.loop || {});
  s.days = s.days || {}; for (const [k, r] of Object.entries(s.days)) r.k = k;
  s.trophies = s.trophies || {};
  return s;
}
function cloudState() { const c = JSON.parse(JSON.stringify(S)); delete c.signupPending; return c; }
function daysPlayed(s) { return s && s.started ? Object.keys(s.days || {}).length : -1; }

/* After Facebook sends someone back: learn who they are, then use whichever garden has more in it */
async function cloudSignInFinish() {
  const ur = await authFetch("/auth/v1/user");
  if (!ur.ok) throw new Error("user");
  const u = await ur.json(), md = u.user_metadata || {};
  AUTH.user = { id: u.id, email: u.email || md.email || null, first: firstName(md.full_name || md.name), provider: (u.app_metadata && u.app_metadata.provider) || "facebook" };
  authSave();
  const pr = await authFetch(`/rest/v1/profiles?id=eq.${encodeURIComponent(u.id)}&select=state`);
  const rows = pr.ok ? await pr.json() : [];
  const remote = rows[0] && rows[0].state;
  let result = "new";
  if (remote && daysPlayed(remote) >= daysPlayed(S) && remote.started) {
    const keepInvite = S.invitedBy, keepCircle = S.circle;
    S = normalizeState(remote);
    if (!S.invitedBy && keepInvite) S.invitedBy = keepInvite;
    if (!S.circle && keepCircle) S.circle = keepCircle;
    result = "restored";
  }
  if (!S.name && AUTH.user.first) S.name = AUTH.user.first;
  S.signupPending = false;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ }
  await cloudPush();
  return result;
}
function cloudPushSoon() {
  if (!signedIn() || !AUTH.user) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(cloudPush, 4000);
}
async function cloudPush(keepalive) {
  if (!signedIn() || !AUTH.user || cloudBusy) return;
  clearTimeout(cloudTimer); cloudBusy = true;
  try {
    await authFetch("/rest/v1/profiles?on_conflict=id", {
      method: "POST", keepalive: !!keepalive,
      headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify({ id: AUTH.user.id, name: (S.name || AUTH.user.first || "").slice(0, 60) || null, email: AUTH.user.email, provider: AUTH.user.provider, invited_by: S.invitedBy || null, state: cloudState(), updated_at: new Date().toISOString() })
    });
  } catch (e) { /* offline: the next save tries again */ }
  finally { cloudBusy = false; }
}
document.addEventListener("visibilitychange", () => { if (document.hidden) cloudPush(true); });

/* --- Memory Lane with interests, family questions and a two-player mode --- */
function triviaMake(practice, players) {
  const r = gameRng("trivia", practice), n = players ? 6 : 5;
  const tags = [...new Set(myInterests().flatMap(i => INTERESTS[i].tags))];
  const order = practice ? shuffle(TRIVIA.map((_, i) => i), r) : shuffle(TRIVIA.map((_, i) => i), rng(777 + dayIndex(dayKey())));
  const liked = order.filter(i => tags.includes(TRIVIA_TAGS[i])), rest = order.filter(i => !tags.includes(TRIVIA_TAGS[i]));
  const picks = [];
  while (picks.length < n && (liked.length || rest.length)) picks.push((picks.length % 3 !== 2 && liked.length ? liked : rest.length ? rest : liked).shift());
  let qs = picks.map(i => { const [q, opts, fact] = TRIVIA[i]; return { q, answer: opts[0], opts: shuffle(opts, r), fact }; });
  const fam = familyQs();
  if (fam.length) {
    const f = practice ? fam[Math.floor(r() * fam.length)] : fam[((dayIndex(dayKey()) % fam.length) + fam.length) % fam.length];
    qs[1] = { q: f.q, answer: f.answer, opts: shuffle([f.answer, ...f.wrong], r), fact: f.note || "A question from your family.", from: f.from || "your family", fid: f.shared ? f.id : null, aid: f.aid || null };
  }
  return { qs, i: 0, right: 0, picked: null, practice: practice || !!players, players: players || null, scores: players ? [0, 0] : null };
}

    <label class="lab" for="p2">Second player</label><input type="text" id="p2" placeholder="Sarah">

    });
}

function gameCard(g, rec, k) {
  const G = GAMES[g], pill = (state, text) => `<span class="pill ${state}">${text}</span>`;
  let footL = G.domain, st;
  if (g === "word") { const w = rec.word; footL = `No. ${dayIndex(k) + 1} · Language`; st = w.done ? pill("done", w.won ? `✓ Solved in ${w.guesses.length}` : "✓ Played") : w.guesses.length ? pill("going", "Keep going") : pill("", "Play"); }
  else if (g === "match") { footL = `Level ${S.garden.unlocked} · Reasoning`; st = G.done(rec) ? pill("done", "✓ Level done") : pill("", "Play"); }
  else if (g === "tiles") { const n = rec.tiles.found.length + rec.tiles.bonus.length; st = rec.tiles.done ? pill("done", `✓ ${n} words`) : n ? pill("going", `${n} found`) : pill("", "Play"); }
  else if (g === "memory") st = rec.memory.done ? pill("done", `✓ ${rec.memory.moves} turns`) : pill("", "Play");
  else if (g === "ws") st = rec.ws.done ? pill("done", "✓ All found") : rec.ws.found.length ? pill("going", `${rec.ws.found.length} found`) : pill("", "Play");
  else if (g === "trivia") st = rec.trivia.done ? pill("done", `✓ ${rec.trivia.right} of 5`) : pill("", "Play");
  else st = G.done(rec) ? pill("done", "✓ Done") : pill("", "Play");
  const open = typeof G.open === "function" ? G.open() : G.open;
  return `<button class="gcard" ${open} style="--card:${G.color}"><span class="gc-text"><h3>${G.name}</h3><p>${G.line}</p></span><span class="gc-art">${G.art()}</span><span class="gc-foot"><span>${footL}</span>${st}</span></button>`;
}

/* ---------- Launch screen for the daily puzzles (NYT style) ---------- */
const SPLASH = {
  word: { name: "Daily Word", line: "Get 6 chances to guess a 5-letter word.", color: "var(--c-word)" },
  tiles: { name: "Word Tiles", line: "Make as many words as you can from six letter tiles.", color: "var(--c-tiles)" },
  memory: { name: "Memory Match", line: "Turn over two cards at a time to find all the pairs.", color: "var(--c-mem)" },
  ws: { name: "Word Search", line: "Find the hidden words in the letter grid.", color: "var(--c-ws)" },
  su: { name: "Sudoku", line: "Fill the grid so every number appears once in each row, column and box.", color: "var(--c-su)" },
  odd: { name: "Odd One Out", line: "Spot the one picture that's different, eight times over.", color: "var(--c-odd)" },
  two: { name: "Two at Once", line: "Keep watering a moving plant while you watch for sunflowers. Doing two things at once is a great workout for focus.", color: "var(--c-two)" },

};
function renderSplash(opts = {}) {

  } else if (g === "tiles") {

    else btns = `<button class="btn block play" data-go="tiles">${n ? "Continue" : "Play"}</button>${how}`;

    else btns = `<button class="btn block play" data-go="memory">Play</button>${how}`;

/* ---------- Garden Loop: wheelbarrow yard + flower pot queue ----------
   Pots wait in one long line on the winding garden path. Wheelbarrows are jammed in the
   yard; each points one way and can only roll out if nothing is in its way. A barrow that
   rolls out parks at the potting bench. Pots at the front of the line hop into a parked
   barrow of their colour (3 pots fill a barrow, which then leaves). If every bench spot
   is full and the front pot has no barrow, the level is lost. */
const KIND_COLORS = ["#E5484D", "#F5B82E", "#3FA34D", "#3B82D6", "#9B5DE5", "#F07C2A"];
const KIND_DARK = ["#8E1F25", "#9A6200", "#1D5E27", "#174A8A", "#4E2483", "#8F3E08"];

}

    if (res === "win") wins++;

// a sensible-but-casual player: frees a barrow for the next pot that has nowhere to go, if it can
function gyCasualWins(s0, tries, r) {

          yard.push(b); occ[rr + "," + cc] = b; placed = true;
        }
        if (!placed) { ok = false; break; }
      }
      if (!ok) continue;

    const by = bedTop + g.rows * cell + 52;
    if (S.trophies.pond) decor += `<g transform="translate(240,${by})">${DECOR.pond}</g>`;
    if (S.trophies.scarecrow) decor += `<g transform="translate(100,${by})">${DECOR.scarecrow}</g>`;
  } else {
    decor += `<rect x="0" y="0" width="360" height="${H}" fill="var(--grass-a)"/>`;
  }
  const bed = `<rect x="${bedX - 6}" y="${bedTop - 6}" width="${7 * cell + 12}" height="${g.rows * cell + 10}" rx="12" fill="#B98A5E" opacity="0.35"/>`;
  const head = ["M", "T", "W", "T", "F", "S", "S"].map((h, i) => `<text x="${bedX + i * cell + cell / 2}" y="${bedTop - 10}" font-size="9" text-anchor="middle" font-weight="700" fill="var(--muted)">${h}</text>`).join("");
  return `<svg viewBox="0 0 360 ${H}" class="scene" role="img" aria-label="Flower bed for ${new Date(year, month, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" })}">${decor}${bed}${withDecor ? "" : head}${plants}</svg>`;
}
function todayFlowerCard() {
  const k = dayKey(), rec = today(), f = flowerFor(k), done = gamesDone(rec), st = played(rec) ? done : -1;
  const left = 4 - done;
  const line = st < 0 ? `Today's seed is a ${f.name}. Play anything to plant it.`
    : done >= 4 ? `Your ${f.name} is in full bloom! A perfect day.`
    : `Your ${f.name} is ${STAGE_NAMES[Math.max(0, done)]}. Finish ${left} more thing${left > 1 ? "s" : ""} to see it bloom.`;
  return `<section class="card today-flower" aria-labelledby="tf">
    <div class="tf-row">
      <svg viewBox="-24 -46 48 52" class="tf-plant ${done >= 4 ? "bloom" : ""}" aria-hidden="true">${plantSVG(f, Math.max(0, st), 0, 0, 1)}</svg>
      <div class="stack" style="gap:8px">
        <h3 id="tf">Today's flower</h3>
        <p>${line}</p>
        <div class="stage-dots" aria-label="${done} of 4 done">${[0, 1, 2, 3].map(i => `<span class="${i < done ? "on" : ""}"></span>`).join("")}</div>
      </div>
    </div>
    <button class="btn block secondary" data-go="progress">See my garden</button>
  </section>`;
}

function renderProgress() {
  const days = Object.values(S.days);
  const tilesWords = days.reduce((s, d) => s + d.tiles.found.length + d.tiles.bonus.length, 0);
  const memGames = days.filter(d => d.memory.done).length;
  const playedKeys = Object.keys(S.days).filter(k => played(S.days[k]));
  const blooms = playedKeys.filter(k => gamesDone(S.days[k]) >= 4).length;
  const now = new Date();
  const months = [...new Set(playedKeys.map(k => k.slice(0, 7)))].filter(m => m !== dayKey().slice(0, 7)).sort().reverse();
  const tr = trophies(), got = tr.filter(x => S.trophies[x.id]).length;
  document.getElementById("app").innerHTML = `
    <div><h1>${esc(possessive(S.name))} flower bed</h1><p class="muted">A new flower is planted every day you play. It grows a little with each thing you finish: seed, sprout, bud, flower, then full bloom.</p></div>
    <button class="btn block secondary" data-go="report">See the family report</button>
    <div class="row"><span class="chip">${playedKeys.length} flower${playedKeys.length === 1 ? "" : "s"} planted</span><span class="chip">${blooms} in full bloom</span></div>
    <div class="card" style="padding:12px">
      <h3>${now.toLocaleDateString(undefined, { month: "long", year: "numeric" })}</h3>
      ${gardenScene(now.getFullYear(), now.getMonth(), true)}
      <div class="stage-legend" aria-hidden="true">${[1, 2, 3, 4].map(sn => `<span><svg viewBox="-18 -44 36 48" width="34" height="44">${plantSVG(flowerFor(dayKey()), sn, 0, 0, 1)}</svg>${sn} done</span>`).join("")}</div>
    </div>
    <section class="stack" aria-labelledby="trh">
      <div class="row between"><h2 id="trh">Garden treasures</h2><span class="muted small">${got} of ${tr.length} found</span></div>
      <p class="muted small">Each treasure appears in your garden when you reach it.</p>
      <div class="trophy-grid">${tr.map(x => `<div class="trophy ${S.trophies[x.id] ? "" : "locked"}">
        <svg viewBox="-45 -62 90 70" aria-hidden="true">${DECOR[x.art]}</svg>
        <strong>${x.name}</strong><span class="small muted">${x.desc}</span>
        ${S.trophies[x.id] ? `<span class="status done">✓ In your garden</span>` : `<div class="bar" role="img" aria-label="${x.have} of ${x.need}"><span style="width:${Math.round(100 * x.have / x.need)}%"></span></div><span class="small muted" style="font-variant-numeric:tabular-nums">${x.have} of ${x.need}</span>`}
      </div>`).join("")}</div>
    </section>
    ${months.length ? `<section class="stack"><h2>Earlier months</h2>${months.map(m => { const [y, mo] = m.split("-").map(Number); const n = playedKeys.filter(k => k.startsWith(m)).length; return `<div class="card" style="padding:12px"><h3>${new Date(y, mo - 1, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" })} · ${n} flower${n === 1 ? "" : "s"}</h3>${gardenScene(y, mo - 1, false)}</div>`; }).join("")}</section>` : ""}
    ${brainBalanceHTML()}
    <h2>Numbers</h2>
    <div class="stats">
      <div class="stat"><div class="n">${streak()}</div><div class="l">Days in a row</div></div>
      <div class="stat"><div class="n">${bestStreak()}</div><div class="l">Longest streak</div></div>
      <div class="stat"><div class="n">${S.garden.unlocked - 1}</div><div class="l">Flower Match levels</div></div>
      <div class="stat"><div class="n">${S.suCount || 0}</div><div class="l">Sudoku solved</div></div>
      <div class="stat"><div class="n">${totalStars()}</div><div class="l">Stars earned</div></div>
      <div class="stat"><div class="n">${S.word.dist.slice(0, 6).reduce((a, b) => a + b, 0)}</div><div class="l">Daily Words solved</div></div>
      <div class="stat"><div class="n">${tilesWords}</div><div class="l">Tile words found</div></div>
      <div class="stat"><div class="n">${memGames}</div><div class="l">Memory games${S.best.memory ? `, best ${S.best.memory} turns` : ""}</div></div>
    </div>
    <div class="card">
      <h3>Daily Word: tries needed</h3>
      <div class="dist">${S.word.dist.map((v, i) => `<div class="b"><span>${i < 6 ? i + 1 : "–"}</span><span class="bar2 ${v === Math.max(...S.word.dist) && v > 0 ? "hi" : ""}" style="width:${Math.max(8, Math.round(100 * v / Math.max(1, ...S.word.dist)))}%">${v}</span></div>`).join("")}</div>
      <p class="muted small">The last row counts words that got away.</p>
    </div>`;
  setTimeout(showTrophyUnlocks, 400);
}

/* ---------- Settings ---------- */
function renderSettings() {
  document.getElementById("app").innerHTML = `
    <h1>Settings</h1>
    ${ACCOUNTS_ON ? accountCard() : ""}
    <div class="card">
      <label class="lab" for="set-name">Your name</label>
      <input type="text" id="set-name" value="${esc(S.name)}">
    </div>
    <div class="card"><h3>Text size</h3>${sizePicker()}</div>
    <div class="card">
      <div class="setting"><div><strong>Extra-strong contrast</strong><p class="muted small">Black and white with thicker edges</p></div>${sw("contrast", "Extra-strong contrast")}</div>
      <div class="setting"><div><strong>Dark background</strong><p class="muted small">Light text on a dark page. Light is easier to read for most people, but some prefer this in the evening.</p></div>${sw("dark", "Dark background")}</div>
      <div class="setting"><div><strong>Gentle sounds</strong><p class="muted small">Soft chimes when you make a match</p></div>${sw("sound", "Gentle sounds")}</div>
      <div class="setting"><div><strong>Read-aloud buttons</strong><p class="muted small">A speaker button next to Bean's messages</p></div>${sw("voice", "Read-aloud buttons")}</div>
    </div>
    <div class="card"><h3>What you enjoy</h3><p class="muted small">Word Search themes and Memory Lane questions lean towards these.</p>${interestChips()}</div>
    ${shareCardHTML()}
    <div class="card"><h3>For family</h3><p class="muted small">A report of the last four weeks: which brain areas are improving and which could use more practice.</p><button class="btn secondary" data-go="report">Open the family report</button></div>
    ${familyQuestionCard()}
    <div class="card family">
      <label class="lab" for="set-family">A note from family</label>
      <p class="muted small">Write a message and it shows on the Today screen. Family can set this up before handing over the tablet.</p>
      <textarea id="set-family" placeholder="We're so proud of you! Love, the kids">${esc(S.family)}</textarea>
      <button class="btn secondary" id="save-family">Save note</button>
    </div>
    ${NATIVE ? reminderCard() : `<div class="card" style="border-color:var(--sun)">
      <h3>Garden Club ${CLUB.on ? (S.member ? `<span class="status done" style="margin-left:6px">Member</span>` : "") : `<span class="status todo" style="margin-left:6px">Coming later</span>`}</h3>
      ${CLUB.on ? `<button class="btn block secondary" data-go="club" style="margin-bottom:10px">${S.member ? "Your membership" : "See the Garden Club"}</button>` : ""}
      <p>Right now everything is free. When you're stuck, you can watch a short video or share on Facebook to keep going.</p>
      <p class="muted small">Later, an optional Garden Club subscription will remove the videos and give you help whenever you need it.</p>
    </div>`}
    <div class="card">
      <h3>About your progress</h3>
      <p class="muted">${signedIn() ? "Progress is saved on this device and to your account." : "Progress is saved in this web browser on this device. Clearing the browser's history or data will clear it too."}</p>
      <button class="btn quiet" id="reset">Start fresh</button>
    </div>
    <div class="card help-links">
      <h3>Help</h3>
      <p class="muted small">How to play, family circle safety and how to contact us.</p>
      <div class="row"><a class="btn secondary" href="support" target="_blank" rel="noopener">Help and contact</a><a class="btn quiet" href="privacy" target="_blank" rel="noopener">Privacy</a></div>
    </div>`;
  wireFamilyQuestions();
  if (ACCOUNTS_ON) wireAccountCard();
  if (NATIVE) wireReminder();
  const nm = document.getElementById("set-name");
  nm.addEventListener("change", () => { S.name = nm.value.trim() || S.name; save(); renderChrome(); toast("Name saved."); });
  document.getElementById("save-family").onclick = () => { S.family = document.getElementById("set-family").value.trim(); save(); toast(S.family ? "Note saved. It's on the Today screen." : "Note removed."); };
  document.getElementById("reset").onclick = () => dialog(`<h2>Start fresh?</h2><p>This clears every streak, star and puzzle saved on this device. It can't be undone.</p><button class="btn block" style="background:var(--heart);border-color:var(--heart)" id="do-reset">Yes, clear everything</button><button class="btn block secondary" data-close>Keep my progress</button>`,
    o => o.querySelector("#do-reset").onclick = () => { const nm2 = S.name; S = freshState(); S.name = nm2; save(); cloudPush(); o.remove(); applySettings(); welcomeStep = "name"; go("welcome"); });
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t || t.classList.contains("piece")) return;
  if (t.dataset.say) return say(t.dataset.say);
  if (t.dataset.interest) { const k = t.dataset.interest, cur = myInterests(); S.profile.interests = cur.includes(k) ? cur.filter(x => x !== k) : cur.concat(k); save(); t.setAttribute("aria-pressed", S.profile.interests.includes(k)); sfx.soft(); return; }
  if (t.dataset.level) { closeDialogs(); return openLevelIntro(+t.dataset.level); }
  if (t.dataset.loop) { closeDialogs(); return openLoopIntro(+t.dataset.loop); }
  if (t.dataset.invite) return t.dataset.invite === "family" ? openFamilyInvite() : openInvite(t.dataset.invite);
  if (t.dataset.go) {
    const v = t.dataset.go;
    const midLevel = (view === "level" && G && G.usedMove && !G.ended) || (view === "loop" && L && L.sent > 0 && !L.ended);
    if (midLevel && v !== view) {
      return dialog(`<h2>Leave this level?</h2><p>This level will start over next time you play it.</p><button class="btn block" id="stay">Keep playing</button><button class="btn block secondary" id="leave">Leave</button>`, o => {
        o.querySelector("#stay").onclick = () => o.remove();
        o.querySelector("#leave").onclick = () => { o.remove(); if (view === "level") G.ended = true; else L.ended = true; go(v, { game: t.dataset.game }); };
      });
    }
    return go(v, { practice: !!t.dataset.practice, game: t.dataset.game });
  }
  if (t.dataset.k) return wordKey(t.dataset.k);
  if (t.dataset.pick !== undefined) { T.picked.push(+t.dataset.pick); sfx.soft(); drawTiles(); tMsg(""); return; }
  if (t.dataset.unpick !== undefined) { T.picked.splice(+t.dataset.unpick, 1); drawTiles(); return; }
  if (t.dataset.card !== undefined) return flipCard(+t.dataset.card);
  if (t.dataset.size !== undefined) { S.settings.size = +t.dataset.size; save(); applySettings(); document.querySelectorAll("[data-size]").forEach(b => b.setAttribute("aria-pressed", b.dataset.size === t.dataset.size)); return; }
  if (t.dataset.switch) { const k = t.dataset.switch; S.settings[k] = !S.settings[k]; save(); applySettings(); t.setAttribute("aria-checked", S.settings[k]); return; }
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || document.querySelector(".overlay")) return;
  if (e.target.matches("input, textarea")) return;
  if (view === "word") {
    if (e.key === "Enter") { e.preventDefault(); wordKey("enter"); }
    else if (e.key === "Backspace") { e.preventDefault(); wordKey("back"); }
    else if (/^[a-zA-Z]$/.test(e.key)) wordKey(e.key.toLowerCase());
  } else if (view === "tiles" && T) {
    const k = e.key.toLowerCase();
    if (e.key === "Enter") { e.preventDefault(); checkTiles(); }
    else if (e.key === "Backspace") { e.preventDefault(); T.picked.pop(); drawTiles(); }
    else if (/^[a-z]$/.test(k)) { const i = T.rack.findIndex((c, j) => c === k && !T.picked.includes(j)); if (i >= 0) { T.picked.push(i); drawTiles(); } }
  }
});

/* ---------- Start ---------- */
applySettings();
noteArrival();
const authResult = authFromUrl();
if (authResult === "signed_in" && !S.started) welcomeStep = "name";
const clubResult = clubFromUrl();
go(clubResult ? "club" : S.started ? "home" : "welcome");
if (clubResult === "welcome") setTimeout(() => toast("Welcome to the Garden Club! No more videos."), 3200);
(function accountStartup() {
  if (authResult === "error") return setTimeout(() => toast("Facebook sign-in didn't finish. You can try again, or play without signing up."), 3200);
  if (authResult === "signed_in") {
    cloudSignInFinish().then(res => {
      setTimeout(() => {
        if (res === "restored") { applySettings(); go("home"); toast(`Welcome back, ${S.name}! Your garden is here.`); }
        else if (!S.started) { welcomeStep = "name"; go("welcome"); toast("Signed in with Facebook."); }
        else { if (view === "settings") renderSettings(); toast("Your garden is now saved to your account."); }
      }, document.getElementById("boot") ? 3100 : 0);
    }).catch(() => toast("Signed in, but couldn't load your garden. Check the internet connection."));
  } else if (signedIn()) {
    cloudPush();   // keep the account copy fresh
  }
})();
(function boot() {
  const el = document.getElementById("boot"); if (!el) return;
  const hello = document.getElementById("boot-hello");
  if (hello && S.started) hello.textContent = `${greeting()}, ${S.name}`;
  let gone = false;
  // Fade the logo out first, then dissolve the dark screen into the app
  const hide = () => {
    if (gone) return; gone = true;
    el.classList.add("leaving");
    setTimeout(() => { el.classList.add("out"); setTimeout(() => { el.remove(); applySettings(); }, 460); }, 700);
  };
  el.addEventListener("click", hide);
  // Logo fades in, holds, and starts fading out at 2.3 s so it is gone by 3 s (the word list loads meanwhile); a tap skips ahead
  const wait = () => setTimeout(hide, Math.max(0, 2300 - performance.now()));
  Promise.race([dictPromise, sleep(2300)]).then(wait);
})();
/* Family circle: open an invite link, and keep the family's memories fresh */
(function circleStartup() {
  const code = joinCodeFromUrl();
  const whenReady = fn => { const t = () => (document.getElementById("boot") || document.querySelector(".overlay")) ? setTimeout(t, 300) : fn(); t(); };
  if (code) whenReady(() => openJoin(code));
  circleSync(true).then(() => { if (view === "settings" && !document.activeElement.matches("input, textarea")) renderSettings(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) circleSync(); });
})();
</script>
</body>
