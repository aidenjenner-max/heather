/* Layout idea: a calm single column like a large-print garden diary. One task per screen, big tap targets, a bottom bar with four places to go. */
:root {
  --bg: #FFFBF5;
  --surface: #FFFFFF;
  --ink: #120127;
  --muted: #5B4D6E;
  --line: #E4DAF0;
  --control: #8E7FA6;
  --accent: #5B24D6;
  --accent-ink: #FFFFFF;
  --accent-soft: #F3ECFF;
  --leaf: #2E7A4B;
  --leaf-soft: #DCEFE1;
  --sun: #FEBF0E;
  --sun-soft: #FFF3CC;
  --sun-line: #8A5A00;
  --heart: #C42B57;
  --focus: #5B24D6;
  --absent: #737079;
  --grass-a: #D7E9CC;
  --grass-b: #C9E0BB;
  --soil: #8A5A3B;
  --bean: #C4B0FF;
  --bean-line: #4A1FB8;
  --bean-cheek: #F95A77;
  --area-speed: #A51D48; --area-language: #B88600; --area-memory: #3D1D8F; --area-attention: #A23A9E; --area-reasoning: #C8580C;
  --brand-gradient: linear-gradient(90deg, #783EFD 0%, #B046B1 38%, #F95A77 66%, #FEBF0E 100%);
  --display: "Fredoka", "Trebuchet MS", "Arial Rounded MT Bold", sans-serif;
  --body: "Atkinson Hyperlegible", "Verdana", "Segoe UI", sans-serif;
  --radius: 18px;
  --tap: 64px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #120127; --surface: #1E0B3B; --ink: #F6F0FF; --muted: #B9AACF; --line: #3A2A55; --control: #6E5A92;
  --accent: #A98BFF; --accent-ink: #120127; --accent-soft: #2A1650; --leaf: #6CC78F; --leaf-soft: #173322;
  --sun: #FEBF0E; --sun-soft: #3A2A10; --sun-line: #FEBF0E; --heart: #F95A77; --focus: #FEBF0E; --absent: #5A5560;
  --grass-a: #2C3E27; --grass-b: #25361F; --soil: #B07A55; --bean: #C4B0FF; --bean-line: #6B46E0; --bean-cheek: #F95A77;
  --area-speed: #E8456F; --area-language: #FFD84D; --area-memory: #9D80FF; --area-attention: #E58BE0; --area-reasoning: #FFA45C;
  color-scheme: dark;
}
body[data-contrast="high"] {
  --bg: #FFFFFF; --surface: #FFFFFF; --ink: #000000; --muted: #1A1A1A; --line: #000000;
  --accent: #3D1A6E; --accent-ink: #FFFFFF; --accent-soft: #FFFFFF; --leaf: #0F5A2C; --leaf-soft: #FFFFFF;
  --sun: #A86200; --sun-soft: #FFFFFF; --heart: #A01010; --absent: #3A3A3A; --grass-a: #FFFFFF; --grass-b: #E8E8E8;
  color-scheme: light;
}
body[data-contrast="high"] .card, body[data-contrast="high"] .btn, body[data-contrast="high"] .cell { border-width: 3px; }
body[data-contrast="high"] .cell { border: 1px solid #000; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
html { font-size: 21px; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 1rem; line-height: 1.45; -webkit-text-size-adjust: 100%; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 1.7rem; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }

.shell { max-width: 640px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 6px; }
.brand { display: flex; align-items: center; gap: 8px; color: var(--ink); white-space: nowrap; min-width: 0; }

.brand .mark-img { width: 31px; height: 45px; flex: none; }
.brand .brand-word { height: 1.15rem; width: auto; display: block; }
.dom-dot { display: inline-block; width: 0.75em; height: 0.75em; border-radius: 50%; margin-right: 6px; vertical-align: -0.05em; box-shadow: 0 0 0 2px var(--card-ink, #120127); }
.brand span { overflow: hidden; text-overflow: ellipsis; }
.chips { display: flex; gap: 8px; flex-wrap: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 2px solid var(--line); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
main { flex: 1; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 16px; }
main:focus { outline: none; }
.nav { position: sticky; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 2px solid var(--line); z-index: 5; }
.nav button { min-height: var(--tap); border: 0; background: transparent; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 700; font-size: 0.78rem; color: var(--muted); cursor: pointer; padding: 4px; }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav svg { width: 28px; height: 28px; }

.card { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }

.btn { min-height: var(--tap); padding: 12px 22px; border-radius: 16px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 1.05rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.btn.secondary { background: var(--surface); color: var(--accent); }
.btn.quiet { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: default; }
.back { align-self: flex-start; min-height: 52px; padding: 8px 16px 8px 10px; font-size: 0.95rem; }

.bean-says { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: end; }
.bubble { background: var(--accent-soft); border: 2px solid var(--accent); border-radius: 20px 20px 20px 6px; padding: 14px 16px; font-size: 1.05rem; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.bubble p { flex: 1; }
.speak { flex: none; width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--accent); background: var(--surface); color: var(--accent); display: grid; place-items: center; cursor: pointer; }
.speak svg { width: 24px; height: 24px; }
.bean-svg { display: block; }
@media (prefers-reduced-motion: no-preference) {
  .bean-svg.bob { animation: bob 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-4px) rotate(-2deg); } }
}

/* Home */
.hero-level { background: var(--leaf-soft); border-color: var(--leaf); }
.hero-level .lvl { font-family: var(--display); font-weight: 700; font-size: 2.4rem; line-height: 1; color: var(--leaf); }
.plan { display: flex; flex-direction: column; gap: 12px; }
.game-card { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%; padding: 16px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); cursor: pointer; min-height: 96px; }
.game-card:hover { border-color: var(--accent); }
.game-card .icon { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 1.5rem; }
.game-card .icon svg { width: 44px; height: 44px; }
.game-card .title { font-family: var(--display); font-weight: 600; font-size: 1.2rem; }
.game-card .sub { color: var(--muted); font-size: 0.9rem; }
.status { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-weight: 700; font-size: 0.85rem; padding: 3px 10px; border-radius: 999px; width: fit-content; }
.status.todo { background: var(--sun-soft); color: var(--ink); border: 2px solid var(--sun-line); }
.status.done { background: var(--leaf); color: #fff; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
.week .d { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.8rem; font-weight: 700; color: var(--muted); }
.week .dot { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; background: var(--surface); }
.week .dot.on { background: var(--sun); border-color: var(--sun-line); color: #2A1E00; }
.week .dot.today { outline: 3px solid var(--accent); outline-offset: 2px; }
.family { border-left: 8px solid var(--heart); }
.family .who { font-weight: 700; color: var(--heart); display: flex; align-items: center; gap: 8px; }
.bar { height: 16px; border-radius: 999px; background: var(--bg); border: 2px solid var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.3s; }

.games { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.games > :last-child:nth-child(odd) { grid-column: 1 / -1; }
.gtile { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 12px 14px; min-height: 0; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); cursor: pointer; }
.gtile:hover { border-color: var(--accent); }
.gicon { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 1.5rem; margin-bottom: 4px; }
.gicon svg { width: 44px; height: 44px; }
.gname { font-family: var(--display); font-weight: 600; font-size: 1.15rem; line-height: 1.15; }
.gsub { color: var(--muted); font-size: 0.85rem; }
.gtile .status { margin-top: auto; }

/* Level sections */
.lsection { display: flex; flex-direction: column; gap: 6px; }
.lsec-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; padding: 12px 14px; background: var(--leaf-soft); border: 2px solid var(--leaf); border-radius: 16px; }
.locked-sec { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 22px 18px; border-radius: 18px; border: 3px dashed var(--line); background: repeating-linear-gradient(45deg, var(--bg) 0 12px, var(--surface) 12px 24px); color: var(--ink); }
.locked-sec .lock-badge { width: 64px; height: 64px; border-radius: 50%; background: var(--surface); border: 3px solid var(--line); display: grid; place-items: center; color: var(--muted); }
.locked-sec .bar { width: 100%; max-width: 320px; }
.btn.fb { background: #1877F2; border-color: #1877F2; color: #fff; text-decoration: none; }
.ad-box { display: flex; flex-direction: column; gap: 12px; }
.ad-screen { aspect-ratio: 16 / 10; border-radius: 14px; background: #1F1A26; color: #F1ECF6; display: grid; place-items: center; text-align: center; padding: 14px; gap: 4px; align-content: center; }

/* Garden path */
.path { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 8px 0 24px; }
.stone-row { display: flex; align-items: center; gap: 10px; }
.stone { width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--leaf); background: var(--surface); color: var(--leaf); font-family: var(--display); font-weight: 700; font-size: 1.6rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; padding: 0; }
.stone .st { font-size: 0.7rem; letter-spacing: 1px; color: var(--sun); margin-top: 4px; font-family: var(--body); }
.stone.current { background: var(--leaf); color: #fff; box-shadow: 0 0 0 6px var(--leaf-soft); }
.stone.locked { border-color: var(--line); color: var(--muted); background: var(--bg); cursor: default; }
.path-note { color: var(--muted); font-size: 0.85rem; text-align: center; }

/* Level */
.hud { display: grid; grid-template-columns: 1fr auto; gap: 10px 14px; align-items: center; }
.moves { text-align: center; background: var(--accent); color: var(--accent-ink); border-radius: 16px; padding: 6px 14px; min-width: 92px; }
.moves b { display: block; font-family: var(--display); font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.moves span { font-size: 0.75rem; font-weight: 700; }
.goals { display: flex; gap: 10px; flex-wrap: wrap; }
.goal { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border-radius: 14px; background: var(--surface); border: 2px solid var(--line); font-weight: 700; font-variant-numeric: tabular-nums; }
.goal svg { width: 36px; height: 36px; }
.goal.met { border-color: var(--leaf); background: var(--leaf-soft); }
.starbar { position: relative; grid-column: 1 / -1; }
.starbar .bar { height: 14px; }
.starbar .mk { position: absolute; top: -9px; transform: translateX(-50%); font-size: 1.1rem; line-height: 1; color: var(--line); }
.starbar .mk.on { color: var(--sun); }
.scoreline { grid-column: 1 / -1; display: flex; justify-content: space-between; font-weight: 700; font-variant-numeric: tabular-nums; }
.board { position: relative; width: 100%; max-width: 560px; margin: 0 auto; aspect-ratio: 1; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 16px; overflow: hidden; border: 3px solid var(--leaf); background: var(--grass-a); }
.cells { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(7, 1fr); }
.cell { background: var(--grass-a); }
.cell:nth-child(odd) { background: var(--grass-b); }
.cell.weed1, .cell.weed2 { background-color: var(--soil); background-image: radial-gradient(circle at 25% 30%, #6FAE4A 0 12%, transparent 13%), radial-gradient(circle at 70% 25%, #5D9B3C 0 10%, transparent 11%), radial-gradient(circle at 45% 75%, #6FAE4A 0 11%, transparent 12%), radial-gradient(circle at 80% 70%, #5D9B3C 0 9%, transparent 10%); }
.cell.weed2 { box-shadow: inset 0 0 0 4px #4A2E1C; }
.pieces { position: absolute; inset: 0; }
.piece { position: absolute; left: 0; top: 0; width: calc(100% / 7); height: calc(100% / 7); padding: 0; border: 0; background: transparent; cursor: pointer; transition: transform 0.24s cubic-bezier(.3,.7,.4,1), opacity 0.2s; }
.piece svg { width: 86%; height: 86%; margin: 7%; display: block; pointer-events: none; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.18)); }
.piece.sel svg { transform: scale(1.12); }
.piece.sel { background: rgba(255,255,255,0.55); border-radius: 14px; box-shadow: inset 0 0 0 3px var(--accent); }
.piece.pop { opacity: 0; }
.piece.pop svg { transform: scale(0.2); transition: transform 0.2s; }
.piece.hint svg { animation: wiggle 0.9s ease-in-out infinite; }
@keyframes wiggle { 0%,100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-10deg) scale(1.1); } 75% { transform: rotate(10deg) scale(1.1); } }
@media (prefers-reduced-motion: reduce) { .piece { transition: none; } .piece.hint svg { animation: none; outline: 4px solid var(--sun); border-radius: 50%; } }
.gmsg { min-height: 2.4rem; text-align: center; font-weight: 700; font-size: 1.05rem; display: grid; place-items: center; }
.cheer { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); font-family: var(--display); font-weight: 700; font-size: 2.2rem; color: #fff; -webkit-text-stroke: 2px var(--accent); paint-order: stroke fill; pointer-events: none; white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) { .cheer { animation: rise 1.1s ease-out forwards; } @keyframes rise { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.8); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } 100% { opacity: 0; transform: translate(-50%, -90%) scale(1); } } }
.level-tools { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.stars-big { font-size: 3rem; letter-spacing: 6px; text-align: center; line-height: 1; }
.stars-big .on { color: var(--sun); }
.stars-big .off { color: var(--line); }

/* Daily Word */
.grid-word { display: grid; grid-template-rows: repeat(6, 1fr); gap: 8px; width: min(100%, 360px); margin: 0 auto; }
.grid-word .r { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.tile { aspect-ratio: 1; border: 3px solid var(--line); border-radius: 10px; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 1.9rem; text-transform: uppercase; background: var(--surface); position: relative; }
.tile.filled { border-color: var(--ink); }
.tile.correct { background: var(--leaf); border-color: var(--leaf); color: #FFFFFF; }
.tile.present { background: var(--sun); border-color: var(--sun); color: #2A1E00; }
.tile.absent { background: var(--absent); border-color: var(--absent); color: #FFFFFF; }
.tile .mark { position: absolute; top: 3px; right: 5px; font-size: 0.55rem; font-family: var(--body); }
@media (prefers-reduced-motion: no-preference) {
  .tile.reveal { animation: flip 0.45s ease both; }
  @keyframes flip { 0% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
}
.kb { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 600px; margin: 0 auto; }
.kb .r { display: flex; gap: 5px; justify-content: center; }
.key { flex: 1 1 0; min-width: 0; height: 62px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; font-size: 1.15rem; cursor: pointer; text-transform: uppercase; padding: 0; }
.key.wide { flex: 1.7 1 0; font-size: 0.8rem; text-transform: none; }
.key.correct { background: var(--leaf); border-color: var(--leaf); color: #FFFFFF; }
.key.present { background: var(--sun); border-color: var(--sun); color: #2A1E00; }
.key.absent { background: var(--absent); border-color: var(--absent); color: #FFFFFF; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; font-size: 0.85rem; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 22px; height: 22px; border-radius: 6px; display: inline-block; }

.hintbox { padding: 12px 16px; background: var(--sun-soft); border: 2px solid var(--sun); border-radius: 14px; }
.dist { display: flex; flex-direction: column; gap: 6px; }
.dist .b { display: grid; grid-template-columns: 1.6rem 1fr; gap: 8px; align-items: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.dist .bar2 { background: var(--absent); color: #fff; padding: 2px 8px; border-radius: 6px; text-align: right; min-width: 2rem; width: fit-content; }
.dist .bar2.hi { background: var(--leaf); }
@media (max-width: 420px) { .key { height: 56px; font-size: 1rem; } .kb .r { gap: 4px; } }

/* Garden Loop */
.loopwrap svg { width: 100%; max-width: 560px; display: block; margin: 0 auto; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.lbarrow { transition: transform 0.46s linear, opacity 0.5s; }
.lbarrow.gone { opacity: 0; }
.lanefront:focus { outline: none; }
.lanefront:focus-visible rect, .lanefront.lhint rect { stroke: var(--sun); stroke-width: 6; }
@media (prefers-reduced-motion: no-preference) { .lanefront.lhint { animation: lpulse 1s ease-in-out infinite; } @keyframes lpulse { 50% { opacity: 0.55; } } }
@media (prefers-reduced-motion: reduce) { .lbarrow { transition: none; } }
@media (prefers-reduced-motion: no-preference) { .ytile.lhint .mv { animation: lpulse 1s ease-in-out infinite; } }
.ytile:focus { outline: none; }
.ytile:focus-visible rect:first-child { stroke: var(--sun); stroke-width: 5; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 5px; }
.seg button { min-height: 54px; border: 0; border-radius: 12px; background: transparent; font-weight: 700; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--leaf); color: #fff; }

/* My Garden */
.scene { width: 100%; display: block; border-radius: 14px; border: 2px solid var(--line); background: var(--grass-a); }
.stage-legend { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 6px; font-size: 0.8rem; font-weight: 700; color: var(--muted); }
.stage-legend span { display: inline-flex; flex-direction: column; align-items: center; }
.today-flower { border-color: var(--leaf); }
.tf-row { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: center; }
.tf-plant { width: 112px; height: 122px; background: linear-gradient(#E6F3FA 0 70%, var(--grass-a) 70%); border-radius: 16px; border: 2px solid var(--line); }
@media (prefers-reduced-motion: no-preference) { .tf-plant { animation: grow 0.8s ease-out; transform-origin: 50% 90%; } @keyframes grow { from { transform: scale(0.85); } to { transform: scale(1); } } .tf-plant.bloom { animation: grow 0.8s ease-out, sway 3s ease-in-out 0.8s infinite; } @keyframes sway { 50% { transform: rotate(-2deg); } } }
.stage-dots { display: flex; gap: 8px; }
.stage-dots span { width: 24px; height: 24px; border-radius: 50%; border: 3px solid var(--leaf); background: var(--surface); }
.stage-dots span.on { background: var(--leaf); }
.trophy-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.trophy { background: var(--surface); border: 2px solid var(--leaf); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.trophy svg { width: 100%; height: 86px; background: var(--leaf-soft); border-radius: 12px; }
.trophy.locked { border-color: var(--line); }
.trophy.locked svg { filter: grayscale(1); opacity: 0.35; background: var(--bg); }
.trophy .bar { width: 100%; height: 12px; }

/* Word Tiles */
.rack { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.ltile { width: 68px; height: 72px; border-radius: 12px; border: 3px solid #B88A3E; background: #F6DFAE; color: #2E2410; font-family: var(--display); font-weight: 700; font-size: 2rem; position: relative; cursor: pointer; display: grid; place-items: center; box-shadow: 0 4px 0 #B88A3E; text-transform: uppercase; padding: 0; }
.ltile sub { position: absolute; right: 6px; bottom: 4px; font-size: 0.7rem; font-family: var(--body); font-weight: 700; }
.ltile.used { opacity: 0.25; box-shadow: none; transform: translateY(4px); }
.ltile.small { width: 54px; height: 58px; font-size: 1.6rem; }
.slots { display: flex; gap: 8px; justify-content: center; min-height: 72px; flex-wrap: wrap; padding: 6px; border-radius: 16px; border: 3px dashed var(--line); }
.slots .empty { align-self: center; color: var(--muted); }
.msg { min-height: 2.6rem; text-align: center; font-weight: 700; font-size: 1.05rem; display: grid; place-items: center; }
.hidden-words { display: flex; flex-direction: column; gap: 10px; }
.hidden-words .grp { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.hidden-words .lbl { width: 100%; font-weight: 700; color: var(--muted); font-size: 0.85rem; }
.hw { display: inline-flex; gap: 3px; }
.hw b { width: 30px; height: 34px; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; font-family: var(--display); text-transform: uppercase; font-size: 1.05rem; background: var(--bg); }
.hw.found b { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.hw b.hint { border-color: var(--sun); background: var(--sun-soft); }
.progress-line { display: flex; align-items: center; gap: 12px; }
.progress-line .bar { flex: 1; }
.found-list { display: flex; flex-wrap: wrap; gap: 8px; }
.found-list span { padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); border: 2px solid var(--accent); font-weight: 700; text-transform: uppercase; }
.found-list span.bonus { background: var(--sun-soft); border-color: var(--sun); }
@media (prefers-reduced-motion: no-preference) { .shake { animation: shake 0.4s; } @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } } }

/* Memory */
.mem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 440px) { .mem { grid-template-columns: repeat(3, 1fr); } }
.mcard { aspect-ratio: 3/4; border-radius: 14px; border: 3px solid var(--accent); background: var(--accent); cursor: pointer; display: grid; place-items: center; font-size: 2.6rem; padding: 0; color: var(--accent-ink); }
.mcard .back-face { width: 60%; opacity: 0.9; }
.mcard.up { background: var(--surface); border-color: var(--ink); }
.mcard.matched { background: var(--leaf-soft); border-color: var(--leaf); cursor: default; }

/* Results, progress, settings */
.big-xp { font-family: var(--display); font-weight: 700; font-size: 2.6rem; color: var(--sun); line-height: 1; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.stat { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px; }
.stat .n { font-family: var(--display); font-weight: 700; font-size: 1.8rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .l { color: var(--muted); font-size: 0.85rem; font-weight: 700; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal .h { text-align: center; font-size: 0.75rem; font-weight: 700; color: var(--muted); }
.cal .c { aspect-ratio: 1; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 0.75rem; font-variant-numeric: tabular-nums; color: var(--muted); }
.cal .c.l1 { background: var(--sun-soft); border-color: var(--sun); color: var(--ink); }
.cal .c.l2 { background: #F4C761; border-color: var(--sun); color: #2A1E00; }
.cal .c.l3 { background: var(--sun); border-color: var(--sun); color: #2A1E00; font-weight: 700; }
.cal .c.today { outline: 3px solid var(--accent); outline-offset: 1px; }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 6px 0; }
.setting + .setting { border-top: 2px solid var(--line); padding-top: 14px; }
.switch { flex: none; width: 76px; height: 44px; border-radius: 999px; border: 3px solid var(--ink); background: var(--bg); position: relative; cursor: pointer; padding: 0; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); transition: left 0.15s; }
.switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.switch[aria-checked="true"]::after { left: 36px; background: var(--accent-ink); }
.sizes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.sizes button { min-height: 84px; border-radius: 14px; border: 3px solid var(--line); background: var(--surface); cursor: pointer; font-family: var(--display); font-weight: 600; }
.sizes button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
input[type="text"], textarea { width: 100%; min-height: var(--tap); padding: 12px 16px; border-radius: 14px; border: 3px solid var(--line); background: var(--surface); font-size: 1.1rem; }
textarea { min-height: 110px; resize: vertical; }
input:focus, textarea:focus { border-color: var(--accent); outline: none; }
label.lab { font-weight: 700; display: block; margin-bottom: 6px; }

.overlay { position: fixed; inset: 0; background: rgba(20, 12, 28, 0.55); display: grid; place-items: center; padding: 16px; z-index: 10; }
.dialog { background: var(--surface); border-radius: 22px; padding: 22px; max-width: 520px; width: 100%; max-height: 90%; overflow: auto; display: flex; flex-direction: column; gap: 14px; border: 3px solid var(--accent); }
.dialog ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px; }
.dialog .center { text-align: center; display: grid; place-items: center; gap: 8px; }
.toast { position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 14px 22px; border-radius: 16px; font-weight: 700; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 420px) {
  .ltile { width: 52px; height: 58px; font-size: 1.6rem; }
  .chip { padding: 4px 8px; gap: 4px; font-size: 0.9rem; }
  .brand { font-size: 1rem; gap: 6px; }
}

/* ===== Redesign layer: Candy Crush board feel + NYT Games clarity ===== */
:root {
  --c-word: #D3E7CD; --c-match: #E6D9F7; --c-tiles: #F5E3BC; --c-loop: #FAD7C3; --c-mem: #F8E197;
  --card-ink: #120127; --card-sub: #4A3F5C;
  --play-bg: linear-gradient(180deg, #CDE7F7 0%, #E9F4DF 48%, #D2E8C1 100%);
}
:root[data-theme="dark"] { --play-bg: linear-gradient(180deg, #1A2430 0%, #18231B 100%); }
.btn { border-radius: 999px; }
.btn.big { min-height: 72px; font-size: 1.3rem; }
.btn.play { background: var(--card-ink); border-color: var(--card-ink); color: #fff; min-height: 70px; font-size: 1.3rem; }
.btn.out { background: transparent; border: 2px solid var(--card-ink); color: var(--card-ink); }
.eyebrow { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }

/* Focus mode: games take the whole screen */
body.playing #topbar, body.playing #nav { display: none !important; }
body.playing main { padding-top: 12px; gap: 12px; }
body[data-view="level"], body[data-view="loop"] { background: var(--play-bg); background-attachment: fixed; }
body[data-view="splash"] { background: var(--splash-bg, var(--bg)); }
.gamebar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
.gb-title { min-width: 0; }
.gb-title h1 { font-size: 1.3rem; }
.gb-title span { display: block; color: var(--muted); font-size: 0.8rem; font-weight: 700; }
.gb-tools { display: flex; gap: 6px; }
.iconbtn { width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
.iconbtn svg { width: 26px; height: 26px; }
.iconbtn.lab { width: auto; min-width: 58px; height: 60px; border-radius: 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 1px; font-size: 0.68rem; font-weight: 700; padding: 0 6px; }
.iconbtn.lab svg { width: 24px; height: 24px; }
.iconbtn:disabled { opacity: 0.4; cursor: default; }

/* Home: NYT-style game cards */
.home-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.home-head h1 { font-size: 1.65rem; }
.today-strip { display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 20px; border: 2px solid var(--leaf); background: var(--surface); text-align: left; cursor: pointer; width: 100%; }
.today-strip .mini { width: 58px; height: 62px; background: linear-gradient(#E6F3FA 0 70%, var(--grass-a) 70%); border-radius: 12px; }
.today-strip strong { font-family: var(--display); font-weight: 600; font-size: 1.05rem; display: block; }
.today-strip .stage-dots span { width: 16px; height: 16px; border-width: 2.5px; }
.gcards { display: flex; flex-direction: column; gap: 14px; }
.gcard { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "text art" "foot foot"; gap: 4px 12px; padding: 18px 18px 14px; border-radius: 24px; border: 0; background: var(--card); color: var(--card-ink); text-align: left; cursor: pointer; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.09); width: 100%; }
.gcard:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.09); }
.gcard h3 { font-size: 1.55rem; font-weight: 700; }
.gcard p { color: var(--card-sub); font-size: 0.95rem; margin-top: 4px; }
.gc-text { grid-area: text; }
.gc-art { grid-area: art; align-self: center; }
.gc-art svg { width: 86px; height: 86px; display: block; }
.gc-foot { grid-area: foot; display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1.5px solid rgba(34, 26, 43, 0.14); font-weight: 700; font-size: 0.9rem; }
.pill { padding: 5px 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.8); color: var(--card-ink); font-weight: 700; font-size: 0.85rem; white-space: nowrap; }
.pill.done { background: #2E7A4B; color: #fff; }
.pill.going { background: var(--card-ink); color: #fff; }
body[data-contrast="high"] .gcard { background: #fff !important; border: 3px solid #000; }

/* Launch screen (NYT style) */
.splash { min-height: calc(100vh - 110px); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; color: var(--card-ink); padding: 8px 6px 24px; }
.splash .sart svg { width: 124px; height: 124px; }
.splash h1 { font-size: 2.5rem; font-weight: 700; color: var(--card-ink); }
.splash .line { font-size: 1.3rem; max-width: 20ch; color: var(--card-ink); }
.splash .btns { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 340px; margin-top: 10px; }
.splash .meta { font-size: 0.95rem; line-height: 1.5; color: var(--card-ink); }
.splash .meta strong { display: block; font-size: 1.05rem; }
body[data-view="splash"] .gamebar .iconbtn { background: rgba(255, 255, 255, 0.7); border-color: rgba(34, 26, 43, 0.2); color: var(--card-ink); }

/* Candy Crush-style HUD and board */
.hudp { background: var(--surface); border-radius: 22px; padding: 12px 14px; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.08); border: 2px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.hud-row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.hud-moves { display: flex; flex-direction: column; align-items: center; min-width: 76px; }
.hud-moves b { font-family: var(--display); font-size: 2.6rem; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.hud-moves span { font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.hud-moves small { font-size: 0.75rem; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.hud-goals { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
.gbadge { position: relative; width: 60px; height: 60px; border-radius: 16px; background: var(--bg); display: grid; place-items: center; }
.gbadge svg { width: 42px; height: 42px; }
.gbadge .n { position: absolute; right: -8px; bottom: -8px; min-width: 30px; height: 30px; padding: 0 7px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 0.85rem; display: grid; place-items: center; border: 3px solid var(--surface); font-variant-numeric: tabular-nums; white-space: nowrap; }
.gbadge.met .n { background: var(--leaf); color: #fff; }
.hud-bean { width: 62px; height: 62px; border-radius: 50%; background: var(--leaf-soft); display: grid; place-items: center; overflow: hidden; border: 3px solid var(--leaf); }
.hud-stars { position: relative; margin: 6px 12px 0; }
.hud-stars .bar { height: 14px; }
.hud-stars .mk { position: absolute; top: -10px; transform: translateX(-50%); font-size: 1.3rem; line-height: 1; color: var(--line); text-shadow: 0 1px 0 var(--surface); }
.hud-stars .mk.on { color: var(--sun); }
.board { border: 0; background: rgba(36, 84, 50, 0.32); box-shadow: 0 6px 0 rgba(0, 0, 0, 0.12); border-radius: 20px; }
.cell, .cell:nth-child(odd) { box-shadow: inset 0 0 0 1px rgba(36, 84, 50, 0.16); }
.cell { background: rgba(255, 255, 255, 0.62); }
.cell:nth-child(odd) { background: rgba(255, 255, 255, 0.46); }
.piece svg { width: 90%; height: 90%; margin: 5%; }
.toolbar { display: flex; justify-content: center; gap: 30px; padding-bottom: 8px; }
.tool { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; font-weight: 700; font-size: 0.85rem; color: var(--ink); cursor: pointer; padding: 0; }
.tool .ti { width: 64px; height: 64px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); display: grid; place-items: center; color: var(--accent); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.1); }
.tool .ti svg { width: 30px; height: 30px; }
.gmsg { min-height: 1.8rem; font-size: 1rem; }
.lvl-pop .big { font-size: 2.6rem; }
.lvl-pop .hud-goals { margin: 6px 0 4px; }

/* Wordle-style Daily Word */
body[data-view="word"] main { padding-bottom: 0; }
.grid-word { width: min(100%, 330px); gap: 7px; }
.grid-word .r { gap: 7px; }
.tile { font-size: 2rem; border-radius: 6px; }
.kb-dock { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); margin-top: auto; }
.key { border-radius: 8px; height: 60px; }
.ex-row { display: flex; gap: 6px; margin: 6px 0 2px; }
.ex-row .tile { width: 48px; height: 48px; aspect-ratio: auto; font-size: 1.4rem; }
.wstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; width: 100%; }
.wstats b { display: block; font-family: var(--display); font-size: 1.9rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.wstats span { font-size: 0.72rem; color: var(--muted); font-weight: 700; }
.dist { width: 100%; }
.mini-grid { display: flex; flex-direction: column; gap: 4px; }
.mini-grid div { display: flex; gap: 4px; }
.mini-grid i { width: 22px; height: 22px; border-radius: 4px; background: var(--absent); }
.mini-grid i.correct { background: var(--leaf); }
.mini-grid i.present { background: var(--sun); }
.gb-title h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 1.2rem; }
.iconbtn.lab { min-width: 52px; padding: 0 4px; }
@media (max-width: 420px) { .gcard h3 { font-size: 1.35rem; } .gc-art svg { width: 72px; height: 72px; } .splash h1 { font-size: 2.1rem; } }

/* New brain games */
:root { --c-ws: #CFE3F3; --c-su: #F3D6DC; --c-odd: #D5EEE6; --c-trivia: #EEDFCB; }
.mgame { position: relative; }
.mg-new { position: absolute; top: 8px; right: 8px; background: #F95A77; color: #fff; font-weight: 800; font-size: 0.8rem; letter-spacing: .04em; padding: 3px 10px; border-radius: 999px; z-index: 1; }
.more-games { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mgame { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px; border-radius: 20px; border: 0; background: var(--card); color: var(--card-ink); text-align: left; cursor: pointer; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.08); }
.mgame .mg-art svg { width: 54px; height: 54px; display: block; }
.mgame .mg-name { font-family: var(--display); font-weight: 600; font-size: 1.1rem; }
.mgame .mg-dom { font-size: 0.8rem; font-weight: 700; }
body[data-contrast="high"] .mgame { background: #fff !important; border: 3px solid #000; }
.ws-grid { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 3px; width: 100%; max-width: 520px; margin: 0 auto; }
.ws-c { aspect-ratio: 1; border: 0; border-radius: 8px; background: var(--surface); font-family: var(--display); font-weight: 700; font-size: 1.15rem; color: var(--ink); cursor: pointer; padding: 0; box-shadow: inset 0 0 0 1.5px var(--line); }
.ws-c.sel { background: var(--sun); color: #2A1E00; box-shadow: none; }
.ws-c.hint { box-shadow: inset 0 0 0 3px var(--sun); }
.ws-c.f0 { background: #9ACBEF; } .ws-c.f1 { background: #B7E0A8; } .ws-c.f2 { background: #F7C9A8; } .ws-c.f3 { background: #D8C2F0; } .ws-c.f4 { background: #F6E08A; }
.ws-c.f { color: #221A2B; box-shadow: none; }
.ws-words { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.ws-words span { padding: 6px 14px; border-radius: 999px; background: var(--surface); border: 2px solid var(--line); font-weight: 700; letter-spacing: 0.04em; }
.ws-words span.done { text-decoration: line-through; opacity: 0.55; background: var(--leaf-soft); border-color: var(--leaf); }
.su-grid { display: grid; grid-template-columns: repeat(var(--n), 1fr); width: min(100%, 420px); margin: 0 auto; border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; background: var(--surface); }
.su-c { aspect-ratio: 1; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface); font-family: var(--display); font-weight: 600; font-size: 1.9rem; color: var(--accent); cursor: pointer; padding: 0; }
.su-grid.n4 .su-c { font-size: 2.4rem; }
.su-c.given { color: var(--ink); font-weight: 700; background: var(--bg); }
.su-c.br { border-right: 3px solid var(--ink); }
.su-c.bb { border-bottom: 3px solid var(--ink); }
.su-c.same { background: var(--accent-soft); }
.su-c.sel { background: var(--sun-soft); box-shadow: inset 0 0 0 3px var(--sun); }
.su-c.wrong { color: var(--heart); background: #FCE3E1; }
.su-pad { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.su-k { min-width: 64px; height: 64px; border-radius: 16px; border: 2px solid var(--accent); background: var(--surface); color: var(--accent); font-family: var(--display); font-weight: 700; font-size: 1.7rem; cursor: pointer; }
.su-k.erase { font-family: var(--body); font-size: 1rem; padding: 0 16px; border-color: var(--line); color: var(--ink); }

:root { --c-peek: #CDECEA; }
.qp-field { position: relative; width: min(100%, 480px); aspect-ratio: 1; margin: 0 auto; }
.qp-field svg { width: 100%; height: 100%; display: block; }
.qp-bg { fill: #F3F8EF; stroke: var(--line); stroke-width: 0.8; }
.qp-box { fill: #FFFFFF; stroke: #6B5E78; stroke-width: 0.9; }
.qp-dot { fill: #221A2B; }
body[data-contrast="high"] .qp-bg { fill: #fff; stroke: #000; stroke-width: 1.2; }
body[data-contrast="high"] .qp-box { stroke: #000; stroke-width: 1.4; }
.qp-spots { position: absolute; inset: 0; }
.qp-spot { position: absolute; width: 19%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: 3px dashed #1F6FB2; background: rgba(59, 130, 214, 0.12); cursor: pointer; padding: 0; }
.qp-spot:hover, .qp-spot:focus-visible { background: rgba(59, 130, 214, 0.3); }
.qp-spot.right { border: 4px solid var(--leaf); background: var(--leaf-soft); box-shadow: 0 0 0 4px var(--leaf); }
.qp-spot.wrong { border: 4px solid #B42318; background: #FDE2E0; }
.qp-answers { min-height: 140px; width: min(100%, 480px); margin: 0 auto; }
.qp-two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.qp-f { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 10px; border-radius: 18px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 700; font-size: 1.1rem; cursor: pointer; }
.qp-f svg { width: 72px; height: 72px; }
.qp-f.right { border-color: var(--leaf); background: var(--leaf-soft); box-shadow: 0 0 0 4px var(--leaf); }
.qp-f.wrong { border-color: #B42318; background: #FDE2E0; }

:root { --c-two: #FBE3C8; --c-walk: #DDEFD0; --c-names: #F4DDEB; }
.two-field { position: relative; width: min(100%, 520px); aspect-ratio: 4 / 3; margin: 0 auto; touch-action: none; user-select: none; -webkit-user-select: none; }
.two-field svg { width: 100%; height: 100%; display: block; }
.two-bg { fill: #EAF4E2; stroke: var(--line); stroke-width: 0.6; }
.two-time { position: absolute; right: 10px; top: 8px; font-weight: 700; font-variant-numeric: tabular-nums; color: #2D6340; }
.two-tap { display: flex; align-items: center; justify-content: center; gap: 12px; width: min(100%, 520px); margin: 0 auto; min-height: 84px; border-radius: 22px; border: 3px solid #9A6200; background: #FFF4D6; color: #2E2410; font: inherit; font-size: 1.35rem; font-weight: 800; cursor: pointer; touch-action: manipulation; }
.two-tap svg { width: 56px; height: 56px; }
.two-tap.pressed { background: #F5D57A; transform: scale(0.98); }
.two-tap.off { opacity: 0.35; }
.two-intro { display: grid; gap: 10px; width: min(100%, 520px); margin: 0 auto; font-weight: 400; }
.two-intro p { margin: 0; font-size: 1.1rem; }
.two-last { margin: 0 0 4px; font-weight: 400; }
body[data-contrast="high"] .two-bg { fill: #fff; stroke: #000; }
.wk-bg { fill: #CFE6BE; stroke: var(--line); stroke-width: 0.6; }
.wk-hedge { fill: #5E9E4E; stroke: #2D6340; stroke-width: 0.8; }
.wk-path { stroke: #E8DCC2; stroke-width: 4.6; stroke-linecap: round; fill: none; }
.wk-trail { stroke: #E9A61C; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; stroke-dasharray: 0.1 3.4; }
.wk-spot { width: 15%; border-color: #9A6200; background: rgba(255, 244, 214, 0.75); }
.wk-qicon svg { width: 2.2em; height: 2.2em; vertical-align: middle; }
body[data-contrast="high"] .wk-path { stroke: #fff; }
body[data-contrast="high"] .wk-hedge { fill: #3E7A30; stroke: #000; }
.nb-card { text-align: center; align-items: center; }
.nb-face svg { width: min(220px, 60vw); height: auto; display: block; margin: 0 auto; }
.nb-face.small svg { width: min(140px, 40vw); }
.nb-name { font-size: 2rem; margin: 4px 0 0; }
.nb-fact { font-size: 1.25rem; margin: 0; }
.nb-kicker { font-weight: 700; color: var(--accent, #5E3A8C); margin: 0; }
.nb-count { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 380px; }
.nb-count span { width: 56px; height: 56px; display: block; }
.nb-count svg { width: 100%; height: 100%; }
.nb-card .tr-opts { width: 100%; }
.nb-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

.pz-q { text-align: center; font-size: 1.15rem; margin: 4px auto 10px; max-width: 520px; }
.pz-board { position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 6px; width: min(100%, 460px); margin: 0 auto; touch-action: none; user-select: none; -webkit-user-select: none; }
.pz-cell { position: relative; aspect-ratio: 1; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1; }
.pz-tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 14px auto 0; max-width: 520px; }
.pz-tools .btn { flex: 1 1 140px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.pz-tools .btn svg { width: 24px; height: 24px; flex: none; }
.bee-cell { z-index: auto; }
.bee-cell.on { background: #FFF1BF; border-color: #B88600; }
.bee-cell.head { box-shadow: 0 0 0 4px #FEBF0E inset; }
.bee-num { position: relative; z-index: 3; width: 72%; height: 72%; border-radius: 50%; background: #783EFD; color: #fff; font-family: "Fredoka", sans-serif; font-weight: 700; font-size: clamp(1.2rem, 6vw, 2rem); display: flex; align-items: center; justify-content: center; border: 3px solid #fff; box-shadow: 0 0 0 2px #4A1FB8; }
.bee-line { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.bee-line polyline { fill: none; stroke: #C8580C; stroke-width: 0.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
.du-board { gap: 10px; }
.du-cell { border-radius: 50%; background: var(--tile); border: 3px solid #4A1FB8; font-family: "Fredoka", sans-serif; font-weight: 700; font-size: clamp(1.4rem, 8vw, 2.6rem); color: #120127; transition: transform .15s; }
.du-cell.sel { transform: scale(1.08); box-shadow: 0 0 0 5px #FEBF0E; }
.du-cell.glow { box-shadow: 0 0 0 6px #FEBF0E; animation: duGlow 1s ease-in-out 3; }
.du-cell.pop { animation: duPop .35s ease-out; }
.du-empty { border: 2px dashed var(--line); background: transparent; cursor: default; }
@keyframes duPop { 0% { transform: scale(.7); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes duGlow { 50% { box-shadow: 0 0 0 10px rgba(254, 191, 14, .45); } }
.vine-board { gap: 6px; }
.vine-cell span { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: clamp(1.4rem, 8vw, 2.4rem); color: #120127; }
.vine-cell.sel { background: #ECE4FF; border-color: #783EFD; box-shadow: 0 0 0 3px #783EFD inset; }
.vine-cell.found { background: var(--tile); border-color: #2D6340; cursor: default; }
.vine-cell.glow { box-shadow: 0 0 0 5px #FEBF0E; }
.vine-wall { border: none; background: repeating-linear-gradient(45deg, #CFE6BE 0 8px, #BFDDAA 8px 16px); cursor: default; }
.vine-line { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.vine-line polyline { fill: none; stroke-width: 0.12; stroke-linecap: round; stroke-linejoin: round; }
.vine-line .done { stroke: #2D6340; opacity: .55; }
.vine-line .now { stroke: #783EFD; opacity: .7; }
.vine-sel { text-align: center; font-family: "Fredoka", sans-serif; font-size: 2rem; font-weight: 700; letter-spacing: .12em; min-height: 1.4em; margin-top: 10px; }
.vine-words { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 14px; margin: 6px auto 0; max-width: 520px; }
.vine-words .vw { font-family: "Fredoka", sans-serif; font-size: 1.3rem; font-weight: 600; letter-spacing: .06em; padding: 4px 12px; border-radius: 12px; background: var(--surface); border: 2px solid var(--line); }
.vine-words .vw.got { background: #D6F0DA; border-color: #2D6340; }
:root[data-theme="dark"] .du-cell, :root[data-theme="dark"] .vine-cell span { color: #120127; }
:root[data-theme="dark"] .vine-cell:not(.found):not(.sel) span { color: var(--ink, #fff); }
.odd-q { text-align: center; font-weight: 700; font-size: 1.1rem; }
.odd-grid { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 8px; width: min(100%, 460px); margin: 0 auto; }
.odd-c { aspect-ratio: 1; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; padding: 10%; }
.odd-c svg { width: 100%; height: 100%; display: block; }
.odd-c.right { border-color: var(--leaf); background: var(--leaf-soft); box-shadow: 0 0 0 4px var(--leaf); }
.tr-card { gap: 16px; }
.tr-q { font-size: 1.35rem; line-height: 1.3; }
.tr-opts { display: flex; flex-direction: column; gap: 10px; }
.tr-o { min-height: 64px; padding: 12px 18px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); text-align: left; font-weight: 700; font-size: 1.1rem; cursor: pointer; color: var(--ink); }
.tr-o:hover:not(:disabled) { border-color: var(--accent); }
.tr-o.right { background: var(--leaf); border-color: var(--leaf); color: #fff; }
.tr-o.wrong { background: #FCE3E1; border-color: var(--heart); color: #7A1A14; }
.tr-o.dim { opacity: 0.5; }
.tr-fact { background: var(--sun-soft); border: 2px solid var(--sun); border-radius: 16px; padding: 14px 16px; }
.bb { display: flex; flex-direction: column; gap: 10px; }
.bb-row { display: grid; grid-template-columns: 6.2rem 1fr 2rem; gap: 10px; align-items: center; font-weight: 700; }
.bb-bar { height: 18px; border-radius: 999px; background: var(--bg); border: 2px solid var(--line); overflow: hidden; }
.bb-bar i { display: block; height: 100%; border-radius: 999px; }
.bb-row b { text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 420px) { .ws-c { font-size: 1rem; border-radius: 6px; } .su-k { min-width: 54px; height: 58px; } }

/* Personalisation, report, family */
.ichips { display: flex; flex-wrap: wrap; gap: 8px; }
.ichip { min-height: 48px; padding: 8px 16px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; color: var(--ink); }
.ichip[aria-pressed="true"] { background: var(--leaf); border-color: var(--leaf); color: #fff; }
.ichip[aria-pressed="true"]::before { content: "✓ "; }
.plan-why { display: flex; gap: 6px; align-items: flex-start; }
.plan-why svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }
.tpill { padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; white-space: nowrap; }
.tpill.up { background: var(--leaf); color: #fff; }
.tpill.steady { background: var(--accent-soft); color: var(--accent); border: 2px solid var(--accent); }
.tpill.low { background: var(--sun-soft); color: #7A4A00; border: 2px solid var(--sun); }
.tpill.start { background: var(--bg); color: var(--muted); border: 2px solid var(--line); }
.rp-area { gap: 8px; }
.wins { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.win-note { background: var(--sun-soft); border: 2px solid var(--sun); border-radius: 14px; padding: 10px 14px; font-weight: 700; width: 100%; }
.fq-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.fq-list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--bg); }
.fq-list .btn { min-height: 44px; padding: 6px 14px; font-size: 0.85rem; }
.tr-turn { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-family: var(--display); font-weight: 600; font-size: 1.15rem; }
.tr-turn span { white-space: nowrap; font-family: var(--body); font-size: 0.85rem; font-weight: 700; opacity: 0.9; }
.tr-from { display: inline-flex; align-items: center; gap: 6px; color: var(--heart); font-weight: 700; font-size: 0.9rem; }

/* Game cards are tinted by brain area, from the logo's colours */
:root {
  --tint-violet: #ECE4FF; --tint-rose: #FFE2E8; --tint-tangerine: #FFE8D3; --tint-sun: #FFF1BF; --tint-orchid: #F7E1F5;
  --c-word: var(--tint-sun); --c-tiles: var(--tint-sun); --c-ws: var(--tint-sun);
  --c-peek: var(--tint-rose);
  --c-match: var(--tint-tangerine); --c-su: var(--tint-tangerine);
  --c-odd: var(--tint-orchid); --c-two: var(--tint-orchid);
  --c-bee: var(--tint-tangerine); --c-dbl: var(--tint-tangerine); --c-vine: var(--tint-sun);
  --c-mem: var(--tint-violet); --c-trivia: var(--tint-violet); --c-walk: var(--tint-violet); --c-names: var(--tint-violet);
}
/* ---------- Share / invite ---------- */
.share-card { background: var(--surface-tint, var(--accent-soft)); border: 2px solid var(--accent); border-radius: 22px; padding: 18px; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; }
.share-card .mark-img { width: 46px; height: 68px; grid-row: span 2; }
.share-card h2 { font-size: 1.3rem; }
.share-card p { color: var(--ink); }
.share-card .share-btns { grid-column: 1 / -1; display: grid; gap: 10px; margin-top: 8px; }
.welcome { max-width: 520px; margin: 0 auto; text-align: center; padding-top: 12px; }
.welcome .bean, .welcome svg:first-child { margin: 0 auto; }
.welcome h1 { font-size: 1.9em; line-height: 1.15; margin: 10px 0 6px; }
.welcome-lead { font-size: 1.2em; margin: 0 0 22px; }
.welcome .btn.fb { display: flex; align-items: center; justify-content: center; gap: 12px; }

.welcome-note { margin: 10px 0 18px; }

.club-cur { margin: 0 0 14px; }

.club-offer .btn.fb, .club .btn.fb { display: flex; align-items: center; justify-content: center; gap: 10px; }

.club-fine { margin: 10px 0 0; }
.fq-acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.small-btn { display: block; margin: 0 auto 10px; font-size: 0.95rem; min-height: 44px; }

.boot { position: fixed; inset: 0; z-index: 100; background: #120127; color: #F6F0FF; display: grid; place-items: center; padding: 24px; cursor: pointer; }
.boot-in { display: flex; flex-direction: column; align-items: center; text-align: center; }
.boot .boot-mark { width: min(36vw, 150px); aspect-ratio: 65.8 / 96.2; }
.boot-word { width: min(58vw, 270px); height: auto; margin-top: 18px; display: block; }
.boot-hello { margin: 18px 0 0; font-family: var(--body); font-size: 1.15rem; color: #E9E1F7; min-height: 1.6em; }
.boot-dots { display: flex; gap: 12px; margin-top: 26px; }
.boot-dots i { width: 14px; height: 14px; border-radius: 50%; display: block; }
.boot-dots i:nth-child(1) { background: #A98BFF; }
.boot-dots i:nth-child(2) { background: #F95A77; }
.boot-dots i:nth-child(3) { background: #FEBF0E; }
/* The logo fades in on the dark screen, holds, fades out on its own, then the dark screen dissolves into the app */
.boot-in { opacity: 0; animation: bootFadeIn 1s ease-out 0.15s forwards; }
.boot.leaving .boot-in { opacity: 1; animation: bootFadeOut 0.7s ease-in forwards; }
.boot { transition: opacity 0.45s ease; }
.boot.out { opacity: 0; pointer-events: none; }
@keyframes bootFadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes bootFadeOut { from { opacity: 1; } to { opacity: 0; } }
@media (prefers-reduced-motion: no-preference) {
  .boot .boot-mark { animation: bootGrow 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.15s both; }
  .boot.leaving .boot-mark { animation: bootShrink 0.7s ease-in forwards; }
  .boot-dots i { animation: bootDot 1.2s 0.9s ease-in-out infinite both; }
  .boot-dots i:nth-child(2) { animation-delay: 1.05s; }
  .boot-dots i:nth-child(3) { animation-delay: 1.2s; }
  @keyframes bootGrow { from { transform: scale(0.94); } to { transform: none; } }
  @keyframes bootShrink { from { transform: none; } to { transform: scale(0.97); } }
  @keyframes bootDot { 0%, 100% { transform: translateY(0); opacity: 0.55; } 40% { transform: translateY(-8px); opacity: 1; } }
}

function normRec(rec) {

  if (!rec.tiles) rec.tiles = { found: [], bonus: [], done: false, goal: false, hints: [], xp: 0 };
  if (!rec.memory) rec.memory = { done: false, moves: 0, xp: 0 };
  if (!rec.ws) rec.ws = { done: false, found: [], hints: 0 };
  if (!rec.su) rec.su = { done: false };
  if (!rec.odd) rec.odd = { done: false };
  if (!rec.trivia) rec.trivia = { done: false };
  if (!rec.peek) rec.peek = { done: false };
  if (!rec.two) rec.two = { done: false };

let audioCtx = null;
function tone(freqs, dur = 0.18, vol = 0.16) {
  if (!S.settings.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    let t = audioCtx.currentTime;
    for (const f of freqs) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur + 0.02); t += dur * 0.8;
    }
  } catch (e) {}
}

/* ---------- Toast & dialog ---------- */
let toastTimer;
function toast(text) {
  const layer = document.getElementById("layer");
  layer.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = text; layer.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3200);
}
function closeDialogs() { document.querySelectorAll(".overlay").forEach(o => o.remove()); }
function dialog(html, onMount, dismissable = true) {
  const layer = document.getElementById("layer");
  const o = document.createElement("div"); o.className = "overlay";
  o.innerHTML = `<div class="dialog" role="dialog" aria-modal="true">${html}</div>`;
  o.addEventListener("click", e => { if ((dismissable && e.target === o) || e.target.closest("[data-close]")) o.remove(); });
  layer.appendChild(o);
  const first = o.querySelector("button, input, textarea"); if (first) first.focus();
  if (onMount) onMount(o);
  return o;
}

function wsMake(practice) {

  const sizes = [[], [3, 3, 3, 4, 4, 4, 4, 4], [3, 4, 4, 4, 5, 5, 5, 5], [4, 4, 5, 5, 5, 5, 5, 5]][lvl];
  const rounds = sizes.map((n, i) => {
    const type = lvl === 1 ? (i < 5 ? "kind" : "size") : lvl === 2 ? ["kind", "turn", "size"][i % 3] : ["turn", "size", "turn", "mirror"][i % 4];
    const theme = MATCH_THEMES[Math.floor(r() * MATCH_THEMES.length)], asym = THEMES[theme].asym;
    const base = type === "turn" || type === "mirror" ? asym[Math.floor(r() * asym.length)] : Math.floor(r() * 6);
    let other = base; while (type === "kind" && other === base) other = Math.floor(r() * 6);
    return { n, type, base, other, odd: Math.floor(r() * n * n), theme };

}

/* ---------- Quick Peek (speed of processing / useful field of view) ----------
   Modelled on the ACTIVE trial's speed training: a picture flashes in the
   middle (and, from stage 2, a butterfly flashes out to the side). Then she
   says what she saw. The flash time adapts after every single peek:
   right -> a little quicker, miss -> a bigger step slower. Four small steps
   down for every one up settles at about 80% right.
   Stage 1: middle only. Stage 2: middle + butterfly. Stage 3: + leaves in the way.
   ========================================================================== */
const PEEK_N = 15, PEEK_MIN = 50, PEEK_MAX = 1000, PEEK_STEP = 1.1, PEEK_MASK = 300;
const PEEK_START = { 1: 400, 2: 500, 3: 600 };
const PEEK_UP_AT = 120, PEEK_DOWN_AT = 900;
const PEEK_PAIRS = [[1, 4], [0, 3], [4, 5]];
const PEEK_NAMES = { 0: "Heart", 1: "Sunflower", 3: "Raindrop", 4: "Heather", 5: "Berry" };
const PEEK_SPOTS = ["Top", "Top right", "Right", "Bottom right", "Bottom", "Bottom left", "Left", "Top left"];
const PEEK_R = 37, PEEK_INNER = 23;
const BUTTERFLY = '<g stroke="#174A8A" stroke-width="4" stroke-linejoin="round"><g><path d="M50 46 C38 12 6 12 10 38 C13 54 32 56 50 50Z" fill="#3B82D6"/><path d="M50 53 C34 58 16 70 25 84 C34 95 47 76 50 58Z" fill="#8EC1F2"/></g><g transform="translate(100 0) scale(-1 1)"><path d="M50 46 C38 12 6 12 10 38 C13 54 32 56 50 50Z" fill="#3B82D6"/><path d="M50 53 C34 58 16 70 25 84 C34 95 47 76 50 58Z" fill="#8EC1F2"/></g></g><rect x="45.5" y="32" width="9" height="44" rx="4.5" fill="#221A2B"/><path d="M48 34 C44 22 40 18 35 16 M52 34 C56 22 60 18 65 16" fill="none" stroke="#221A2B" stroke-width="3.5" stroke-linecap="round"/>';
const PEEK_LEAF = '<path d="M18 82 C16 46 42 18 82 18 C84 58 56 84 18 82Z" fill="#A9C79A" stroke="#5E7F50" stroke-width="5"/>';

function peekState() {
  S.peek = S.peek || { stage: 1, durs: {}, hist: [] };
  S.peek.durs = S.peek.durs || {}; S.peek.hist = S.peek.hist || [];
  return S.peek;
}
function peekDur(stage) { const P = peekState(); return P.durs[stage] || PEEK_START[stage]; }
function peekXY(i, r = PEEK_R) { const a = (i * 45 - 90) * Math.PI / 180; return [50 + r * Math.cos(a), 50 + r * Math.sin(a)]; }
function peekArtAt(x, y, size, art) { return `<g transform="translate(${x - size / 2} ${y - size / 2}) scale(${size / 100})">${art}</g>`; }

let QP = null;
function renderPeek(opts = {}) {
  const rec = today(), P = peekState();
  const practice = !!opts.practice || rec.peek.done;
  const r = gameRng("peek", practice);

  QP = { token: Math.random(), i: 0, right: 0, stage, dur: peekDur(stage), shown: [], practice, pair, r, answer: null, started: false };
  document.getElementById("app").innerHTML = `
    ${gameBar("home", practice ? "Practice Quick Peek" : "Quick Peek", `${PEEK_N} peeks · Stage ${stage} of 3`, iconBtn("qphow", ICON.help, "Help"))}
    <div class="progress-line"><strong id="qpcount">Ready when you are</strong><div class="bar"><span id="qpbar"></span></div></div>
    <p class="odd-q" id="qpq">Keep your eyes on the middle square.</p>

  document.getElementById("qpans").addEventListener("click", e => { const b = e.target.closest("[data-qpf]"); if (b && QP.answer) QP.answer({ flower: +b.dataset.qpf, el: b }); });
  document.getElementById("qpspots").addEventListener("click", e => { const b = e.target.closest("[data-qps]"); if (b && QP.answer) QP.answer({ spot: +b.dataset.qps, el: b }); });

function howToPeek() {
  const st = (S.peek && S.peek.stage) || 1;
  dialog(`<h2>How to play Quick Peek</h2><ul>
    <li>Keep your eyes on the <strong>middle square</strong>. A flower will flash there for just a moment.</li>
    ${st >= 2 ? `<li>At the same time, a <strong>blue butterfly</strong> flashes somewhere around the edge.</li>` : `<li>Later on, a butterfly will flash around the edge too.</li>`}
    ${st >= 3 ? `<li>Now there are leaves around as well. Ignore them and look for the butterfly.</li>` : ""}

    <li>Get one right and the next flash is a little quicker. Miss one and it slows down. Missing about one in five is just right: that means it's working your brain.</li></ul>
    <p class="muted small">This game is based on the speed training used in a large, long-running study of older adults.</p>
    <button class="btn block" data-close>Let's play</button>`);
}
function peekField(inner) { const s = document.getElementById("qpsvg"); if (s) s.innerHTML = `<rect x="1" y="1" width="98" height="98" rx="8" class="qp-bg"/>${inner}`; }
function peekBox(content = "") { return `<rect x="38" y="38" width="24" height="24" rx="5" class="qp-box"/>${content}`; }
function peekDraw(phase, T) {
  const spots = document.getElementById("qpspots"); if (spots) spots.innerHTML = "";

  if (phase === "fix") return peekField(peekBox(`<circle cx="50" cy="50" r="2.2" class="qp-dot"/>`));
  if (phase === "show") {
    let out = peekBox(peekArtAt(50, 50, 20, KIND_ART[T.flower]));
    if (T.distract) out += T.distract.map(([x, y]) => peekArtAt(x, y, 11, PEEK_LEAF)).join("");

/* =====================================================================
   Three daily puzzles in the style of the short "daily logic" games:
   Bee Line (one path through every square), Double Up (join matching
   numbers until one is left) and Word Vines (words winding through a
   letter grid, every letter used once). Our own names, art and rules
   wording; all built for big fingers and no timers.
   ===================================================================== */

/* ---- shared grid helpers ---- */
function gridNb(i, w, h) { const x = i % w, y = (i / w) | 0, o = []; if (x > 0) o.push(i - 1); if (x < w - 1) o.push(i + 1); if (y > 0) o.push(i - w); if (y < h - 1) o.push(i + w); return o; }

  const iters = N * N * 4;

    const end = p[N - 1], nbs = gridNb(end, w, h).filter(c => c !== p[N - 2]);
    const n = nbs[Math.floor(r() * nbs.length)], k = p.indexOf(n);
    p = p.slice(0, k + 1).concat(p.slice(k + 1).reverse());

}

function bumpMsg(id, text) { const m = document.getElementById(id); if (m) m.textContent = text; }

/* ======================= Bee Line ======================= */
let BEE = null;
function beeMake(practice) {
  const lvl = adaptLevel("bee"), r = gameRng("bee", practice);
  const w = [0, 4, 5, 6][lvl], N = w * w, K = [0, 5, 7, 8][lvl];
  const sol = randomFullPath(w, w, r);
  const inner = shuffle([...Array(N - 2)].map((_, i) => i + 1), r).slice(0, K - 2).sort((a, b) => a - b);
  const idx = [0, ...inner, N - 1], nums = {};

}
function renderBee(opts = {}) {
  const rec = today();
  BEE = beeMake(!!opts.practice || rec.bee.done);
  document.getElementById("app").innerHTML = `
    ${gameBar("home", BEE.practice ? "Practice Bee Line" : "Bee Line", `${BEE.w}×${BEE.w} garden · ${LEVEL_WORD[BEE.lvl]}`, iconBtn("beehow", ICON.help, "Help"))}
    <p class="pz-q" id="beeq"></p>
    <div class="pz-board bee-board" id="beeboard" style="--n:${BEE.w}"></div>
    <div class="msg" id="beemsg" role="status" aria-live="polite"></div>
    <div class="pz-tools"><button class="btn secondary" id="beeundo">${ICON.back} Undo</button><button class="btn secondary" id="beehint">${ICON.bulb} Hint</button><button class="btn quiet" id="beeclear">${ICON.restart} Start over</button></div>`;
  document.getElementById("beehow").onclick = howToBee;
  document.getElementById("beeundo").onclick = () => { if (BEE.done) return; BEE.path.pop(); drawBee(); };
  document.getElementById("beeclear").onclick = () => { if (BEE.done) return; BEE.path = []; drawBee(); };
  document.getElementById("beehint").onclick = beeHint;
  gridPointer(document.getElementById("beeboard"), {
    down: c => {
      if (BEE.done) return;
      const at = BEE.path.indexOf(c);
      if (!BEE.path.length) { if (BEE.nums[c] === 1) { BEE.path = [c]; sfx.soft(); } else bumpMsg("beemsg", "Start on flower 1."); }
      else if (at >= 0) BEE.path = BEE.path.slice(0, at + 1);
      else if (isNb(c, BEE.path[BEE.path.length - 1], BEE.w)) beeStep(c);

    move: c => {

      const p = BEE.path;
      if (p.length > 1 && c === p[p.length - 2]) p.pop();
      else if (!p.includes(c) && isNb(c, p[p.length - 1], BEE.w)) beeStep(c);

function beeNext() { return BEE.path.filter(c => BEE.nums[c]).length + 1; }
function beeStep(c) {

  if (n === BEE.K && BEE.path.length < BEE.N - 1) { bumpMsg("beemsg", `Flower ${BEE.K} is the last stop. Fill every other square first.`); sfx.oops(); return false; }
  BEE.path.push(c); bumpMsg("beemsg", "");
  if (n) sfx.good(); else sfx.pop && sfx.pop(BEE.path.length % 8);

  BEE.path = BEE.sol.slice(0, Math.min(BEE.N, i + 1));
  BEE.hints++;
  bumpMsg("beemsg", i < had ? "Your path went a different way here. Bean moved it back and showed the next square." : "Bean showed you the next square.");

function drawBee() {
  const { w, path, nums } = BEE, board = document.getElementById("beeboard"); if (!board) return;
  const on = new Set(path), last = path[path.length - 1];
  const pts = path.map(c => `${(c % w) + 0.5},${((c / w) | 0) + 0.5}`).join(" ");

    const n = nums[c];
    return `<div class="pz-cell bee-cell${on.has(c) ? " on" : ""}${c === last ? " head" : ""}" data-cell="${c}" role="button" aria-label="${n ? `Flower ${n}` : "Square"}${on.has(c) ? ", on your path" : ""}">${n ? `<span class="bee-num">${n}</span>` : ""}</div>`;
  }).join("") + `<svg class="bee-line" viewBox="0 0 ${w} ${w}" aria-hidden="true"><polyline points="${pts}"/></svg>`;

  document.getElementById("beeq").textContent = !path.length ? "Start on flower 1 and drag the bee's path." : left ? `Next flower: ${beeNext() <= BEE.K ? beeNext() : BEE.K}. ${left} square${left === 1 ? "" : "s"} still to visit.` : "Every square visited!";

function howToBee() {
  dialog(`<h2>How to play Bee Line</h2><ul>
    <li>Help the bee fly one path through the garden.</li>
    <li>Start on flower <strong>1</strong> and visit the flowers in order: 1, 2, 3…</li>
    <li>Visit <strong>every square</strong> once. The path moves up, down, left or right, never corner to corner.</li>
    <li>Drag your finger, or tap one square at a time. Tap a square on your path to go back to it.</li></ul>
    <button class="btn block" data-close>Let's fly</button>`);
}
function finishBee() {
  if (BEE.done) return; BEE.done = true;
  const secs = Math.round((Date.now() - BEE.t0) / 1000), h = BEE.hints;
  const note = BEE.practice ? "" : adaptSet("bee", h === 0, h >= 3);
  if (!BEE.practice) { Object.assign(today().bee, { done: true, hints: h, secs }); save(); recordPerf("bee", Math.max(20, 100 - h * 15)); noteWin(checkBest("bee" + BEE.lvl, secs, true, `Bee Line in ${secs} seconds, your fastest yet!`)); }

/* ======================= Double Up ======================= */
let DU = null;
function duMake(practice) {
  const lvl = adaptLevel("dbl"), r = gameRng("dbl", practice);
  const w = [0, 3, 4, 4][lvl], h = [0, 3, 3, 4][lvl], tiles = [0, 5, 7, 9][lvl];
  for (let tries = 0; tries < 400; tries++) {
    const cells = Array(w * h).fill(0);
    cells[Math.floor(r() * cells.length)] = 2 ** (tiles + 1);
    let n = 1;
    while (n < tiles) {
      const can = cells.map((v, i) => i).filter(i => cells[i] >= 4 && gridNb(i, w, h).some(j => !cells[j]));
      if (!can.length) break;
      can.sort((a, b) => cells[b] - cells[a] + (r() - 0.5) * cells[a]);
      const i = can[Math.floor(r() * Math.min(can.length, 2))], empt = gridNb(i, w, h).filter(j => !cells[j]), j = empt[Math.floor(r() * empt.length)];
      cells[i] /= 2; cells[j] = cells[i]; n++;
    }
    if (n === tiles && duSolve(cells, w, h)) return { w, h, start: cells.slice(), cells, hist: [], sel: null, hints: 0, restarts: 0, practice, lvl, t0: Date.now(), done: false, tiles };
  }
  return null;
}

  const out = [];
  cells.forEach((v, i) => { if (v) gridNb(i, w, h).forEach(j => { if (cells[j] === v) out.push([i, j]); }); });
  return out;
}

  for (const [i, j] of duMoves(cells, w, h)) {

    const rest = duSolve(nx, w, h, seen); if (rest) return [[i, j], ...rest];
  }

}
function renderDbl(opts = {}) {
  const rec = today();
  DU = duMake(!!opts.practice || rec.dbl.done);
  document.getElementById("app").innerHTML = `
    ${gameBar("home", DU.practice ? "Practice Double Up" : "Double Up", `${DU.tiles} numbers · ${LEVEL_WORD[DU.lvl]}`, iconBtn("duhow", ICON.help, "Help"))}
    <p class="pz-q" id="duq">Join matching numbers that sit side by side.</p>
    <div class="pz-board du-board" id="duboard" style="--n:${DU.w}"></div>
    <div class="msg" id="dumsg" role="status" aria-live="polite"></div>
    <div class="pz-tools"><button class="btn secondary" id="duundo">${ICON.back} Undo</button><button class="btn secondary" id="duhint">${ICON.bulb} Hint</button><button class="btn quiet" id="duclear">${ICON.restart} Start over</button></div>`;
  document.getElementById("duhow").onclick = howToDbl;
  document.getElementById("duundo").onclick = () => { if (DU.done || !DU.hist.length) return; DU.cells = DU.hist.pop(); DU.sel = null; bumpMsg("dumsg", ""); drawDbl(); };
  document.getElementById("duclear").onclick = () => { if (DU.done) return; if (DU.hist.length) DU.restarts++; DU.cells = DU.start.slice(); DU.hist = []; DU.sel = null; bumpMsg("dumsg", ""); drawDbl(); };
  document.getElementById("duhint").onclick = duHint;
  let from = null;
  gridPointer(document.getElementById("duboard"), {
    down: c => { from = c; },
    move: () => {},
    up: c => {
      if (DU.done || from === null) return;
      if (c !== null && c !== from && DU.cells[from]) { duTry(from, c); from = null; return; }
      const t = from; from = null;
      if (!DU.cells[t]) { DU.sel = null; drawDbl(); return; }
      if (DU.sel === null || DU.sel === t) { DU.sel = DU.sel === t ? null : t; drawDbl(); return; }

function duTry(a, b) {

  if (cells[a] !== cells[b]) { DU.sel = b; bumpMsg("dumsg", "Only the same numbers can join."); sfx.oops(); drawDbl(); return; }
  if (!isNb(a, b, w)) { DU.sel = b; bumpMsg("dumsg", "They need to be side by side, not corner to corner."); sfx.oops(); drawDbl(); return; }
